<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Correção Quadrada OMR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            text-align: center;
            background-color: #f8f9fa;
        }
        h2 { color: #333; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-camera { background-color: #007bff; }
        .btn-enviar { background-color: #28a745; display: none; }
        
        /* O canvas é forçado visualmente a ser um quadrado */
        #canvasQuadrado {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #e9ecef;
            border: 3px dashed #007bff;
            border-radius: 8px;
            object-fit: cover;
            display: none;
            margin: 15px 0;
        }

        #status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <h2>Leitor de Gabarito</h2>

    <select id="inputDisciplina" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background-color: white;">
        <option value="Filosofia">Filosofia</option>
        <option value="Sociologia">Sociologia</option>
    </select>
    
    <input type="text" id="inputTurma" placeholder="Turma (ex: 3 Série A)">
    <input type="text" id="inputAluno" placeholder="Nome do Aluno">

    <label for="cameraInput" class="btn btn-camera">📸 Capturar Gabarito</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <canvas id="canvasQuadrado"></canvas>

    <button id="btnEnviar" class="btn btn-enviar" onclick="enviarGabarito()">Enviar para Correção</button>

    <div id="status"></div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const canvas = document.getElementById('canvasQuadrado');
        const ctx = canvas.getContext('2d');
        const btnEnviar = document.getElementById('btnEnviar');
        const statusDiv = document.getElementById('status');

        let processandoEnvio = false;

        // 1. Processamento da imagem após a foto ser tirada
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = function() {
                // Descobre qual é o menor lado para fazer o corte quadrado perfeito
                const menorLado = Math.min(img.width, img.height);
                
                // Calcula as coordenadas do centro
                const startX = (img.width - menorLado) / 2;
                const startY = (img.height - menorLado) / 2;

                // Reduz para 800x800 px para evitar o erro 413 e acelerar a rede
                const tamanhoFinal = 800; 
                canvas.width = tamanhoFinal;
                canvas.height = tamanhoFinal;

                // Corta o centro e redimensiona a imagem no canvas
                ctx.drawImage(img, startX, startY, menorLado, menorLado, 0, 0, tamanhoFinal, tamanhoFinal);

                canvas.style.display = 'block';
                btnEnviar.style.display = 'block';
                statusDiv.style.display = 'none';
            }
            img.src = URL.createObjectURL(file);
        });

        // 2. Envio dos dados para o Python
        function enviarGabarito() {
            if (processandoEnvio) return;
            processandoEnvio = true;
            
            const disciplina = document.getElementById('inputDisciplina').value; // Captura a disciplina
            const turma = document.getElementById('inputTurma').value.trim();
            const aluno = document.getElementById('inputAluno').value.trim();

            statusDiv.style.display = "block";
            statusDiv.innerHTML = "<strong>Aguarde...</strong> Enviando imagem.";
            statusDiv.style.background = "#fff3cd";
            btnEnviar.disabled = true;

            // Transforma o canvas num arquivo físico (.jpg) diretamente no navegador
            canvas.toBlob((blob) => {
                if (!blob) {
                    statusDiv.innerHTML = "Erro ao processar a imagem no celular.";
                    processandoEnvio = false;
                    return;
                }

                const formData = new FormData();
                // O nome "imagem" aqui é o que o seu Python procura no request.files
                formData.append("imagem", blob, "gabarito_quadrado.jpg");
                formData.append("disciplina", disciplina); // <--- NOVO
                formData.append("turma", turma);
                formData.append("aluno", aluno);

                // Substitua pela URL da sua API no Render se necessário
                fetch("https://api-corretor-provas.onrender.com/processar_gabarito", {
                    method: "POST",
                    body: formData
                })
                .then(async response => {
                    const isJson = response.headers.get('content-type')?.includes('application/json');
                    const data = isJson ? await response.json() : null;
                    if (!response.ok) throw new Error(data ? data.mensagem : `Erro HTTP ${response.status}`);
                    return data;
                })
                .then(data => {
                    if (data.status === "erro") {
                        statusDiv.innerHTML = `<strong>Falha:</strong><br>${data.mensagem}`;
                        statusDiv.style.background = "#f8d7da";
                    } else {
                        statusDiv.innerHTML = `<strong>Sucesso!</strong><br>Aluno: ${aluno}<br>Respostas: ${data.respostas.join(", ")}<br><small>${data.mensagem}</small>`;
                        statusDiv.style.background = "#d4edda";
                        
                        document.getElementById('inputAluno').value = "";
                        document.getElementById('inputAluno').focus();
                        canvas.style.display = 'none';
                        btnEnviar.style.display = 'none';
                    }
                })
                .catch(error => {
                    statusDiv.innerHTML = `<strong>Erro no Servidor:</strong><br>${error.message}`;
                    statusDiv.style.background = "#f8d7da";
                })
                .finally(() => {
                    processandoEnvio = false;
                    btnEnviar.disabled = false;
                });
            }, "image/jpeg", 0.8); // Qualidade de 80% (leve e nítido)
        }
    </script>
</body>
</html>
